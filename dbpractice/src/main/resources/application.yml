server:
  port: 8080

spring:
  application:
    name: dblab

  datasource:
    url: jdbc:mysql://localhost:3307/dblab
    username: lab
    password: labpass
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: DbLabPool
 
  sql:
    init:
      mode: always

logging:
  level:
    com.zaxxer.hikari: DEBUG
