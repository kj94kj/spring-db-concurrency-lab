services:
  mysql:
    image: mysql:8.4
    container_name: dblab-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dblab
      MYSQL_USER: lab
      MYSQL_PASSWORD: labpass

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
